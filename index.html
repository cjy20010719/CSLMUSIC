<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSL编曲作品集</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f5f5f7; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h1 { color: #1d1d1f; font-size: 24px; }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CSL编曲试听</h1>
        <p style="color: #666;">氛围流行</p>
        <audio controls>
            <source src="DDSJJT.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
    </div>
    <div class="card" style="margin-top: 20px;">
        <p style="color: #666;">流行弦乐</p>
        <audio controls>
            <source src="JHSAQ.mp3" type="audio/mpeg">
        </audio>
    </div>
    <div class="card" style="margin-top: 20px;">
        <p style="color: #666;">实录编曲</p>
        <audio controls>
            <source src="LLJFS.mp3" type="audio/mpeg">
        </audio>
    </div>
    <div class="card" style="margin-top: 20px;">
        <p style="color: #666;">流行四重奏</p>
        <audio controls>
            <source src="HM.mp3" type="audio/mpeg">
        </audio>
</body>
</html>
